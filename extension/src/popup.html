<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Shared Cart</title>
  <style>
    body {
      width: 300px;
      font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
      padding: 16px;
      color: #1a1a1a;
    }
    h1 {
      font-size: 15px;
      margin: 0 0 4px;
    }
    p.sub {
      font-size: 12px;
      color: #666;
      margin: 0 0 14px;
    }
    button {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      background: #ff9900;
      color: #1a1a1a;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
    }
    button:disabled {
      background: #eee;
      color: #999;
      cursor: default;
    }
    #status {
      margin-top: 12px;
      font-size: 12px;
      color: #444;
      word-break: break-word;
    }
    #status a {
      color: #cc6600;
      font-weight: 600;
    }
    #copyBtn {
      margin-top: 8px;
      background: #f0f0f0;
      display: none;
    }
  </style>
</head>
<body>
  <h1>Shared Cart</h1>
  <p class="sub">Share what's in this cart with a family member.</p>
  <button id="shareBtn">Scan cart &amp; get share link</button>
  <button id="copyBtn">Copy link</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
